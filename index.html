<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--h:#111111;--text:#333333;--muted:#777777;--border:#E5E5E5;--hover:#F5F5F5;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px}
.logo{display:block;line-height:0}
.logo img{height:44px;width:auto;display:block}
.langs{display:flex;gap:2px}
.langs button{border:0;background:none;padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.langs button:hover{background:var(--hover)}
.langs button.on{color:var(--h);font-weight:600}
main{flex:1;padding-top:20px;padding-bottom:44px}
h1{margin:0 0 10px;font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:700;color:var(--h);text-wrap:balance}
.sub{margin:0 0 28px;color:var(--text);max-width:44ch}
.banner{display:block;width:100%;aspect-ratio:5/2;object-fit:cover;object-position:50% 62%;border-radius:16px;border:1px solid var(--border);margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:10px 18px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--h);border-color:var(--h);color:#fff;font-weight:500}
input[type=search]{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:16px;color:var(--h);background:var(--bg)}
input[type=search]::placeholder{color:var(--muted)}
input[type=search]:focus{outline:2px solid var(--h);outline-offset:1px;border-color:var(--h)}
.list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--h);font-weight:500}
.item:hover{background:var(--hover)}
.item small{margin-left:auto;color:var(--muted);font-weight:400;font-size:14px}
.item::after{content:"";width:7px;height:7px;flex:none;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg)}
.item:not(:has(small))::after{margin-left:auto}
.mono{width:44px;height:44px;flex:none;border-radius:10px;background:var(--hover);border:1px solid var(--border);color:var(--h);display:grid;place-items:center;font-size:18px;font-weight:600;overflow:hidden}
.mono img{width:100%;height:100%;object-fit:cover}
.hint{color:var(--muted);margin:8px 0}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:15px}
body:not(.admin) .back::before{content:"";width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.back:hover{color:var(--h)}
.hero-mono{width:84px;height:84px;border-radius:18px;font-size:34px;margin-bottom:18px}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:12px;background:var(--h);color:#fff;text-decoration:none;font-weight:600;font-size:16px}
.btn:hover{background:#333}
.btn::after{content:"";width:7px;height:7px;margin-left:auto;border-top:1.5px solid #fff;border-right:1.5px solid #fff;transform:rotate(45deg);opacity:.7}
.pf{width:36px;height:36px;flex:none;border-radius:9px;background:#fff;display:grid;place-items:center}
.pf svg{width:24px;height:24px;display:block}
a:focus-visible,button:focus-visible{outline:2px solid var(--h);outline-offset:2px}
footer{border-top:1px solid var(--border);color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-top:16px;padding-bottom:18px}
footer a{color:var(--muted)}
footer a:hover{color:var(--h)}
footer .copy{margin-left:auto}
@media (min-width:768px){.wrap{max-width:640px}h1{font-size:34px}main{padding-top:48px}}
:root{--accent:#111111;--accent-dark:#111111}
:root{--danger:#b00020}
/* ---- панель администратора ---- */
body.admin footer{display:none}
body.admin .wrap{width:100%;max-width:760px;margin:0 auto;padding:0 20px}
body.admin header{border-bottom:1px solid var(--border)}
body.admin header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
body.admin header img{height:34px;width:auto;display:block}
body.admin header .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
body.admin main{padding-top:20px;padding-bottom:60px}
body.admin h1{margin:0 0 6px;font-size:24px;line-height:1.2;color:var(--h)}
body.admin h2{margin:24px 0 8px;font-size:17px;color:var(--h)}
body.admin .help{color:var(--muted);font-size:13px;margin:2px 0 8px}
body.admin .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
body.admin .tab{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
body.admin .tab:hover{background:var(--hover)}
body.admin .tab.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--h);font-weight:600;background:var(--hover)}
body.admin .card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0}
body.admin .card.off{background:#fafafa}
body.admin .card.off .name{color:var(--muted)}
body.admin .vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
body.admin .vrow .name{flex:1 1 180px;font-weight:600;color:var(--h)}
body.admin .vrow .name small{display:block;font-weight:400;color:var(--muted)}
body.admin .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
body.admin label.f{display:block;font-weight:500;color:var(--h);margin:14px 0 4px;font-size:14px}
body.admin input[type=text],body.admin input[type=url],body.admin input[type=email],body.admin input[type=password],body.admin input[type=search],body.admin select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:15px;background:var(--bg);color:var(--h)}
body.admin input:focus,body.admin select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
body.admin .row{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap;align-items:center}
body.admin .row .grow{flex:1 1 200px}
body.admin .b{border:1px solid var(--border);background:var(--bg);color:var(--h);padding:9px 13px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
body.admin .b:hover{background:var(--hover)}
body.admin .b:disabled{opacity:.5;cursor:default}
body.admin .b.main{background:var(--h);color:#fff;border-bottom:3px solid var(--accent);font-weight:600}
body.admin .b.main:hover{background:#333}
body.admin .b.danger{color:var(--danger)}
body.admin .b.sq{padding:9px 11px}
body.admin .chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;white-space:nowrap}
body.admin .chk input{width:18px;height:18px;accent-color:var(--accent)}
body.admin .err{color:var(--danger);background:#fff1f1;border:1px solid #f3c6c6;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
body.admin .ok{color:var(--accent-dark);background:#f5f5f5;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
body.admin .note{background:#f5f5f5;border:1px solid #e5e5e5;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px}
body.admin .login{max-width:380px;margin:40px auto}
body.admin .hint{color:var(--muted);margin:8px 0}
body.admin details{margin-top:14px}
body.admin summary{cursor:pointer;color:var(--muted);font-size:14px}
body.admin .logo-prev{display:flex;align-items:center;gap:12px;margin:6px 0}
body.admin .logo-prev img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--border)}
body.admin .pl-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
body.admin .pl-title h3{margin:0;font-size:15px;color:var(--h)}
</style>
</head>

<!-- SQL для подготовки базы: копируется кнопкой на экране входа в панель -->
<script type="text/plain" id="schema-sql">
-- Apex: структура базы данных. Выполняется один раз в Supabase: SQL Editor -> New query -> вставить -> Run.

-- ========== Таблицы ==========
create table if not exists countries (
  id uuid primary key default gen_random_uuid(),
  name_ru text not null, name_ky text, name_en text,
  sort int not null default 0,
  active boolean not null default true
);

create table if not exists cities (
  id uuid primary key default gen_random_uuid(),
  country_id uuid not null references countries(id) on delete restrict,
  name_ru text not null, name_ky text, name_en text,
  sort int not null default 0,
  active boolean not null default true
);

create table if not exists platforms (
  id uuid primary key default gen_random_uuid(),
  key text not null unique,
  name_ru text not null, name_ky text, name_en text,
  sort int not null default 0,
  active boolean not null default true
);

create table if not exists venues (
  id uuid primary key default gen_random_uuid(),
  slug text not null unique,
  city_id uuid not null references cities(id) on delete restrict,
  name text not null, name_ky text, name_en text,
  logo_url text,
  sort int not null default 0,
  active boolean not null default true,
  created_at timestamptz not null default now()
);

create table if not exists venue_links (
  id uuid primary key default gen_random_uuid(),
  venue_id uuid not null references venues(id) on delete cascade,
  platform_id uuid not null references platforms(id) on delete restrict,
  label text,
  url text not null check (url ~ '^https://'),
  sort int not null default 0,
  active boolean not null default true
);

create index if not exists idx_cities_country on cities (country_id);
create index if not exists idx_venues_city on venues (city_id);
create index if not exists idx_links_venue on venue_links (venue_id);

-- ========== Права доступа ==========
-- Посетители (anon) только читают видимые записи.
-- Администратор (вошедший пользователь, authenticated) читает и меняет всё.
alter table countries   enable row level security;
alter table cities      enable row level security;
alter table platforms   enable row level security;
alter table venues      enable row level security;
alter table venue_links enable row level security;

drop policy if exists countries_public on countries;
create policy countries_public   on countries   for select to anon using (active);
drop policy if exists cities_public on cities;
create policy cities_public      on cities      for select to anon using (active);
drop policy if exists platforms_public on platforms;
create policy platforms_public   on platforms   for select to anon using (active);
drop policy if exists venues_public on venues;
create policy venues_public      on venues      for select to anon using (active);
drop policy if exists venue_links_public on venue_links;
create policy venue_links_public on venue_links for select to anon using (active);

drop policy if exists countries_admin on countries;
create policy countries_admin   on countries   for all to authenticated using (true) with check (true);
drop policy if exists cities_admin on cities;
create policy cities_admin      on cities      for all to authenticated using (true) with check (true);
drop policy if exists platforms_admin on platforms;
create policy platforms_admin   on platforms   for all to authenticated using (true) with check (true);
drop policy if exists venues_admin on venues;
create policy venues_admin      on venues      for all to authenticated using (true) with check (true);
drop policy if exists venue_links_admin on venue_links;
create policy venue_links_admin on venue_links for all to authenticated using (true) with check (true);

grant select on countries, cities, platforms, venues, venue_links to anon;
grant select, insert, update, delete on countries, cities, platforms, venues, venue_links to authenticated;

-- ========== Хранилище для логотипов ==========
insert into storage.buckets (id, name, public) values ('logos', 'logos', true) on conflict (id) do nothing;

drop policy if exists logos_admin_insert on storage.objects;
create policy logos_admin_insert on storage.objects for insert to authenticated with check (bucket_id = 'logos');
drop policy if exists logos_admin_update on storage.objects;
create policy logos_admin_update on storage.objects for update to authenticated using (bucket_id = 'logos');
drop policy if exists logos_admin_delete on storage.objects;
create policy logos_admin_delete on storage.objects for delete to authenticated using (bucket_id = 'logos');

-- ========== Начальные данные (добавляются только в пустую базу) ==========
do $seed$
begin
if not exists (select 1 from countries) then
insert into countries (name_ru, name_ky, name_en, sort) values ('Кыргызстан', 'Кыргызстан', 'Kyrgyzstan', 10);

insert into cities (country_id, name_ru, name_ky, name_en, sort)
select (select id from countries limit 1), n.ru, n.ky, n.en, n.s
from (values ('Бишкек', 'Бишкек', 'Bishkek', 10),
             ('Каракол', 'Каракол', 'Karakol', 20),
             ('Ош', 'Ош', 'Osh', 30)) as n(ru, ky, en, s);

insert into platforms (key, name_ru, name_ky, name_en, sort) values
  ('2gis',      '2GIS',         '2GIS',            '2GIS',        10),
  ('google',    'Google Maps',  'Google Maps',     'Google Maps', 20),
  ('yandex',    'Яндекс Карты', 'Яндекс Карталар', 'Yandex Maps', 30),
  ('instagram', 'Instagram',    'Instagram',       'Instagram',   40);

insert into venues (slug, city_id, name, name_ky, name_en, sort)
values ('karakolka', (select id from cities where name_en = 'Karakol'), 'Караколка', 'Караколка', 'Karakolka', 10);

insert into venue_links (venue_id, platform_id, url, sort)
values ((select id from venues where slug = 'karakolka'),
        (select id from platforms where key = '2gis'),
        'https://2gis.kg/karakol/firm/70000001088255116', 10);
end if;
end
$seed$;

</script>

/* ========== СОСТОЯНИЕ ========== */
let lang = 'ru';
try { lang = localStorage.getItem('apex-lang') || 'ru'; } catch (e) {}
if (!UI[lang]) lang = 'ru';

let DATA = null;          // { countries, cities, platforms, venues }
let status = 'loading';   // loading | ready | error | setup
let country = '', city = '', query = '';

const t = key => UI[lang][key];
const loc = names => names[lang] || names.ru;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'value') n.value = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  n.append(...kids.flat().filter(Boolean));
  return n;
}
function isSafeUrl(u) { try { return new URL(u).protocol === 'https:'; } catch (e) { return false; } }

// плитка заведения: логотип, а если его нет или он не загрузился, первая буква названия
function mono(v, extra) {
  const letter = loc(v.names).trim().charAt(0).toUpperCase();
  const box = el('span', { class: 'mono' + (extra ? ' ' + extra : ''), 'aria-hidden': 'true' }, letter);
  if (v.logo) box.replaceChildren(el('img', { src: v.logo, alt: '', onerror: () => box.replaceChildren(letter) }));
  return box;
}
// значок платформы; если для ключа нет значка, кнопка остаётся просто с текстом
function platformIcon(p) {
  if (!ICON[p.key]) return null;
  const s = el('span', { class: 'pf', 'aria-hidden': 'true' });
  s.innerHTML = ICON[p.key];   // значки заданы в коде выше, пользовательских данных тут нет
  return s;
}

/* ========== ЗАГРУЗКА ДАННЫХ ИЗ БАЗЫ ========== */
const nm = r => ({ ru: r.name_ru, ky: r.name_ky || r.name_ru, en: r.name_en || r.name_ru });

function build(co, ci, pl, ve) {
  const platforms = pl.map(p => ({ id: p.id, key: p.key, names: nm(p) }));
  const known = new Set(platforms.map(p => p.id));
  const countries = co.map(c => ({ id: c.id, names: nm(c) }));
  const cIds = new Set(countries.map(c => c.id));
  const cities = ci.filter(c => cIds.has(c.country_id)).map(c => ({ id: c.id, country: c.country_id, names: nm(c) }));
  const cityIds = new Set(cities.map(c => c.id));
  const venues = ve.filter(v => cityIds.has(v.city_id)).map(v => {
    const links = {};
    (v.venue_links || []).slice().sort((a, b) => a.sort - b.sort).forEach(l => {
      if (known.has(l.platform_id)) (links[l.platform_id] = links[l.platform_id] || []).push({ label: l.label || '', url: l.url });
    });
    return { slug: v.slug, city: v.city_id, logo: v.logo_url || null,
      names: { ru: v.name, ky: v.name_ky || v.name, en: v.name_en || v.name }, links };
  });
  return { countries, cities, platforms, venues };
}

async function load() {
  if (!CFG.url || !CFG.anonKey || /PASTE_/.test(CFG.url + CFG.anonKey)) { status = 'setup'; return render(); }
  const get = p => fetch(CFG.url + '/rest/v1/' + p, { headers: { apikey: CFG.anonKey } })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  try {
    const [co, ci, pl, ve] = await Promise.all([
      get('countries?select=id,name_ru,name_ky,name_en&active=eq.true&order=sort'),
      get('cities?select=id,country_id,name_ru,name_ky,name_en&active=eq.true&order=sort'),
      get('platforms?select=id,key,name_ru,name_ky,name_en&active=eq.true&order=sort'),
      get('venues?select=slug,city_id,name,name_ky,name_en,logo_url,venue_links(label,url,sort,platform_id)&active=eq.true&order=sort')
    ]);
    const next = build(co, ci, pl, ve);
    const same = DATA && JSON.stringify(DATA) === JSON.stringify(next);
    DATA = next; status = 'ready';
    try { localStorage.setItem('apex-cache', JSON.stringify(next)); } catch (e) {}
    if (!same) render();
  } catch (e) {
    if (!DATA) { status = 'error'; render(); }
  }
}

// Показываем последние сохранённые данные сразу, пока грузятся свежие

function homePage() {
  const list = el('div', { class: 'list' });
  const multiCountry = DATA.countries.length > 1;
  const cityList = DATA.cities.filter(c => !multiCountry || c.country === country);

  function fillList() {
    list.replaceChildren();
    const term = query.trim().toLowerCase();
    if (!city && !term) { list.append(el('p', { class: 'hint' }, t('hint'))); return; }
    const cityById = new Map(DATA.cities.map(c => [c.id, c]));
    const found = DATA.venues.filter(v => {
      if (city && v.city !== city) return false;
      if (multiCountry && country && cityById.get(v.city).country !== country) return false;
      return !term || Object.values(v.names).some(n => n.toLowerCase().includes(term));
    });
    if (!found.length) { list.append(el('p', { class: 'hint' }, t('none'))); return; }
    for (const v of found) {
      list.append(el('a', { class: 'item', href: '#/r/' + v.slug },

        el('span', {}, loc(v.names)),
        city ? null : el('small', {}, loc(cityById.get(v.city).names))));

  const cityChips = (!multiCountry || country) ? el('div', { class: 'chips' }, cityList.map(c =>
    chip(city === c.id, loc(c.names), () => { city = city === c.id ? '' : c.id; render(); }))) : null;

  fillList();
  return [el('img', { class: 'banner', src: BANNER, alt: '' }), el('h1', {}, t('greet')), el('p', { class: 'sub' }, t('sub')), countryChips, cityChips, input, list];
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'value') n.value = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  n.append(...kids.flat().filter(Boolean));
  return n;
}
function isSafeUrl(u) { try { return new URL(u).protocol === 'https:'; } catch (e) { return false; } }

const RU = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m',
  'н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ы':'y','э':'e','ю':'yu','я':'ya' };

const configured = () => CFG.url && CFG.anonKey && !/PASTE_/.test(CFG.url + CFG.anonKey);

function friendly(status, body) {
  const code = body && body.code;
  if (code === '23503') return 'Это нельзя удалить: к нему привязаны другие записи (например, в городе есть заведения). Сначала скройте его или удалите связанные записи.';
  if (code === '23505') return 'Такая запись уже есть.';
  if (status === 401 || status === 403) return 'Сессия истекла. Войдите заново.';
  if (status === 0) return 'Нет связи с сервером. Проверьте интернет.';
  if (status === 404) return 'В базе не найдены таблицы. Выполните SQL из блока «Первый запуск» на экране входа.';
  return 'Не получилось сохранить (ошибка ' + status + '). Попробуйте ещё раз.';
}

function saveSession(j) {
  session = { access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: (j.user && j.user.email) || (session && session.email) || '' };
  try { localStorage.setItem('apex-admin', JSON.stringify(session)); } catch (e) {}
}
function logout() {
  session = null; form = null;
  try { localStorage.removeItem('apex-admin'); } catch (e) {}
  render();
}
async function authCall(grant, payload) {
  const r = await fetch(CFG.url + '/auth/v1/token?grant_type=' + grant, { method: 'POST',
    headers: { apikey: CFG.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('auth');
  return j;
}
async function token() {
  if (!session) throw Object.assign(new Error('Войдите в панель.'), { status: 401 });
  if (session.expires_at - 60 < Date.now() / 1000) {
    try { saveSession(await authCall('refresh_token', { refresh_token: session.refresh_token })); }
    catch (e) { throw Object.assign(new Error(friendly(401)), { status: 401 }); }
  }
  return session.access_token;
}
async function api(method, path, body) {
  const tk = await token();
  let r;
  try {
    r = await fetch(CFG.url + path, { method,
      headers: { apikey: CFG.anonKey, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (e) { throw Object.assign(new Error(friendly(0)), { status: 0 }); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw Object.assign(new Error(friendly(r.status, j)), { status: r.status, code: j && j.code });
  return j;
}

async function loadAll() {

    api('GET', '/rest/v1/venues?select=*,venue_links(*)&order=sort')

// Выполняет действие, обновляет данные и показывает результат
async function run(fn, okMsg) {

const nextSort = rows => rows.reduce((m, r) => Math.max(m, r.sort), 0) + 10;

async function move(table, all, list, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  await run(async () => {
    const order = all.slice().sort((a, b) => a.sort - b.sort);
    const ns = new Map(order.map((r, k) => [r.id, (k + 1) * 10]));
    const a = list[i], b = list[j], tmp = ns.get(a.id);
    ns.set(a.id, ns.get(b.id)); ns.set(b.id, tmp);
    await Promise.all(order.filter(r => ns.get(r.id) !== r.sort)
      .map(r => api('PATCH', '/rest/v1/' + table + '?id=eq.' + r.id, { sort: ns.get(r.id) })));
  });
}
const toggle = (table, r) => run(() => api('PATCH', '/rest/v1/' + table + '?id=eq.' + r.id, { active: !r.active }),

  run(() => api('DELETE', '/rest/v1/' + table + '?id=eq.' + r.id), 'Удалено: «' + label + '».');
};

async function uploadLogo(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = 320, k = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
  const name = 'v-' + Date.now() + '.jpg', tk = await token();
  const r = await fetch(CFG.url + '/storage/v1/object/logos/' + name, { method: 'POST',
    headers: { apikey: CFG.anonKey, Authorization: 'Bearer ' + tk, 'Content-Type': 'image/jpeg' }, body: blob });
  if (!r.ok) throw new Error('Не удалось загрузить картинку (ошибка ' + r.status + ').');
  return CFG.url + '/storage/v1/object/public/logos/' + name;
}

    el('p', { class: 'help' }, 'Откройте заведение на нужной платформе, скопируйте ссылку из адресной строки и вставьте сюда. Платформы без ссылки оставьте пустыми, кнопки для них не появятся. Если у заведения несколько филиалов, добавьте строку на каждый и впишите адрес: гость выберет нужный из списка.'),
    ...D.platforms.map(platformBlock),
    el('label', { class: 'chk', style: 'margin:14px 0' }, el('input', { type: 'checkbox', checked: d.active, onchange: e => { d.active = e.target.checked; } }), 'Показывать на сайте'),
    err ? el('div', { class: 'err' }, err) : null,
    el('div', { class: 'row' },
      el('button', { type: 'button', class: 'b main', onclick: saveVenue }, 'Сохранить'),
      el('button', { type: 'button', class: 'b', onclick: () => { form = null; err = ''; render(); } }, 'Отмена'))
  ];
}

async function saveVenue() {
  const d = form.d, name = d.name.trim();
  if (!name) { err = 'Введите название заведения.'; return render(); }
  if (!d.city_id) { err = 'Выберите город.'; return render(); }
  const links = [];
  for (const p of D.platforms) {
    const rows = d.links[p.id].map(r => ({ label: r.label.trim(), url: r.url.trim(), active: r.active })).filter(r => r.label || r.url);
    if (rows.some(r => !isSafeUrl(r.url))) { err = 'Проверьте ссылки в блоке «' + p.name_ru + '»: нужна полная ссылка, которая начинается с https://'; return render(); }
    rows.forEach((r, i) => links.push({ platform_id: p.id, label: r.label || null, url: r.url, sort: (i + 1) * 10, active: r.active }));
  }
  if (!links.length) { err = 'Добавьте хотя бы одну ссылку, иначе гостю нечего будет нажать.'; return render(); }

  const row = { name, name_ky: d.name_ky.trim() || null, name_en: d.name_en.trim() || null, city_id: d.city_id,
    logo_url: d.logo_url || null, active: d.active };
  await run(async () => {
    let id = d.id;
    if (id) {
      await api('PATCH', '/rest/v1/venues?id=eq.' + id, row);
    } else {
      const base = slugify(name) || 'venue';
      let slug = base, saved = null;
      for (let n = 2; n < 20 && !saved; n++) {
        try { saved = await api('POST', '/rest/v1/venues', { ...row, slug, sort: nextSort(D.venues) }); }
        catch (e) { if (e.code !== '23505') throw e; slug = base + '-' + n; }
      }
      if (!saved) throw new Error('Не удалось подобрать адрес для заведения. Измените название.');
      id = saved[0].id;
    }
    await api('DELETE', '/rest/v1/venue_links?venue_id=eq.' + id);
    await api('POST', '/rest/v1/venue_links', links.map(l => ({ ...l, venue_id: id })));
    form = null;
  }, 'Сохранено: «' + name + '». Заведение уже на сайте.');
}

/* ========== СТРАНЫ, ГОРОДА, ПЛАТФОРМЫ ========== */
const ENT = {
  countries: { title: 'Страны', one: 'страну', rows: () => D.countries, parent: null },
  cities:    { title: 'Города', one: 'город', rows: () => D.cities, parent: { key: 'country_id', list: () => D.countries, label: 'Страна' } },
  platforms: { title: 'Платформы', one: 'платформу', rows: () => D.platforms, parent: null }
};

function entityTab(name) {
  const E = ENT[name], rows = E.rows();
  const parentName = r => { if (!E.parent) return ''; const p = E.parent.list().find(x => x.id === r[E.parent.key]); return p ? p.name_ru : ''; };
  const hints = { countries: 'Страна нужна, чтобы группировать города. Пока страна одна, гости её не видят. Когда добавите вторую, на главной появится выбор страны.',
    cities: 'Город появляется на главной странице как кнопка. Скрытый город и его заведения гостям не показываются.',
    platforms: 'Платформа это кнопка на странице заведения (2GIS, Google Maps и т.д.). Новую платформу можно добавить здесь, а ссылки на неё указать в каждом заведении.' };
  return [
    el('p', { class: 'help' }, hints[name]),
    el('div', { class: 'row' }, el('button', { type: 'button', class: 'b main', onclick: () => {
      if (E.parent && !E.parent.list().length) { err = 'Сначала добавьте страну во вкладке «Страны».'; return render(); }
      form = { kind: 'entity', name, d: { id: null, name_ru: '', name_ky: '', name_en: '', parent: E.parent ? E.parent.list()[0].id : null } }; msg = ''; err = ''; render(); } }, '+ Добавить ' + E.one)),
    rows.length ? rows.map((r, i) => el('div', { class: 'card' + (r.active ? '' : ' off') }, el('div', { class: 'vrow' },
      el('div', { class: 'name' }, r.name_ru, el('small', {}, [parentName(r), r.active ? '' : 'скрыто с сайта'].filter(Boolean).join(' · ') || ' ')),
      el('button', { type: 'button', class: 'b sq', 'aria-label': 'Выше', onclick: () => move(name, rows, rows, i, -1) }, '↑'),
      el('button', { type: 'button', class: 'b sq', 'aria-label': 'Ниже', onclick: () => move(name, rows, rows, i, 1) }, '↓'),
      el('button', { type: 'button', class: 'b', onclick: () => { form = { kind: 'entity', name, d: { id: r.id, name_ru: r.name_ru, name_ky: r.name_ky || '', name_en: r.name_en || '', parent: E.parent ? r[E.parent.key] : null } }; msg = ''; err = ''; render(); } }, 'Изменить'),
      el('button', { type: 'button', class: 'b', onclick: () => toggle(name, r) }, r.active ? 'Скрыть' : 'Показать'),
      el('button', { type: 'button', class: 'b danger', onclick: () => remove(name, r, r.name_ru) }, 'Удалить'))))
      : el('p', { class: 'hint' }, 'Пока пусто.')
  ];
}

function entityForm() {
  const { name, d } = form, E = ENT[name];
  return [
    el('a', { href: '#', style: 'color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:12px',
      onclick: e => { e.preventDefault(); form = null; err = ''; render(); } }, '← Назад'),
    el('h1', {}, (d.id ? 'Изменить ' : 'Добавить ') + E.one),
    E.parent ? [el('label', { class: 'f' }, E.parent.label),
      el('select', { onchange: e => { d.parent = e.target.value; } }, E.parent.list().map(p => el('option', { value: p.id, selected: p.id === d.parent }, p.name_ru)))] : null,
    el('label', { class: 'f' }, 'Название'),
    el('input', { type: 'text', value: d.name_ru, oninput: e => { d.name_ru = e.target.value; } }),
    el('details', {}, el('summary', {}, 'Названия на кыргызском и английском (необязательно)'),
      el('label', { class: 'f' }, 'По-кыргызски'),
      el('input', { type: 'text', value: d.name_ky, oninput: e => { d.name_ky = e.target.value; } }),
      el('label', { class: 'f' }, 'По-английски'),
      el('input', { type: 'text', value: d.name_en, oninput: e => { d.name_en = e.target.value; } })),
    err ? el('div', { class: 'err' }, err) : null,
    el('div', { class: 'row' },
      el('button', { type: 'button', class: 'b main', onclick: saveEntity }, 'Сохранить'),
      el('button', { type: 'button', class: 'b', onclick: () => { form = null; err = ''; render(); } }, 'Отмена'))
  ];
}

async function saveEntity() {
  const { name, d } = form, E = ENT[name], title = d.name_ru.trim();
  if (!title) { err = 'Введите название.'; return render(); }
  const row = { name_ru: title, name_ky: d.name_ky.trim() || null, name_en: d.name_en.trim() || null };
  if (E.parent) row[E.parent.key] = d.parent;
  await run(async () => {
    if (d.id) await api('PATCH', '/rest/v1/' + name + '?id=eq.' + d.id, row);
    else {
      const body = { ...row, sort: nextSort(E.rows()) };
      if (name === 'platforms') {
        const base = slugify(d.name_en || title) || 'platform';
        let key = base, saved = null;
        for (let n = 2; n < 20 && !saved; n++) {
          try { saved = await api('POST', '/rest/v1/platforms', { ...body, key }); }
          catch (e) { if (e.code !== '23505') throw e; key = base + '-' + n; }
        }
        if (!saved) throw new Error('Не удалось сохранить платформу. Измените название.');
      } else await api('POST', '/rest/v1/' + name, body);
    }
    form = null;
  }, 'Сохранено: «' + title + '».');
}

/* ========== РЕЗЕРВНАЯ КОПИЯ ========== */
function backupTab() {
  return [
    el('p', { class: 'help' }, 'Резервная копия это один файл со всеми странами, городами, платформами, заведениями и ссылками. Скачивайте его время от времени и после больших изменений, а хранить лучше в нескольких местах (почта, облако).'),
    el('div', { class: 'row' }, el('button', { type: 'button', class: 'b main', onclick: () => {
      const blob = new Blob([JSON.stringify({ saved_at: new Date().toISOString(), ...D }, null, 2)], { type: 'application/json' });
      const a = el('a', { href: URL.createObjectURL(blob), download: 'apex-backup-' + new Date().toISOString().slice(0, 10) + '.json' });
      document.body.append(a); a.click(); a.remove();
    } }, 'Скачать резервную копию')),
    el('p', { class: 'help' }, 'Чтобы восстановить данные из файла, обратитесь к разработчику.')
  ];
}

/* ========== ОБЩИЙ КАРКАС ========== */
const TABS = [['venues', 'Заведения'], ['cities', 'Города'], ['countries', 'Страны'], ['platforms', 'Платформы'], ['backup', 'Резервная копия']];

function render() {
  if (location.hash !== '#/admin') return;
  $('top').replaceChildren(
    el('img', { src: LOGO, alt: 'Apex' }),
    session ? el('div', { class: 'who' }, session.email || '', el('button', { type: 'button', class: 'b', onclick: logout }, 'Выйти')) : null);

  const root = $('page');
  if (!configured()) return root.replaceChildren(el('div', { class: 'err' }, 'Панель ещё не подключена к базе. Откройте файл config.js и вставьте адрес проекта и публичный ключ (см. SETUP.md).'));
  if (!session) return root.replaceChildren(loginView());

  if (form) return root.replaceChildren(...(form.kind === 'venue' ? venueForm() : entityForm()).flat().filter(Boolean));

  const body = tab === 'venues' ? venuesTab() : tab === 'backup' ? backupTab() : entityTab(tab);
  root.replaceChildren(
    el('h1', {}, 'Панель администратора'),
    el('div', { class: 'tabs' }, TABS.map(([id, label]) =>
      el('button', { type: 'button', class: 'tab' + (tab === id ? ' on' : ''), onclick: () => { tab = id; msg = ''; err = ''; render(); } }, label))),
    msg ? el('div', { class: 'ok' }, msg) : null,
    err ? el('div', { class: 'err' }, err) : null,
    ...body.flat().filter(Boolean));
}

let loaded = false;
function enter() {
  const on = location.hash === '#/admin';
  document.body.classList.toggle('admin', on);
  if (!on) return;
  if (configured() && session && !loaded) { loaded = true; run(async () => {}); }
  render();
}
window.addEventListener('hashchange', enter);
enter();

})();
</script>
</body>
</html>
